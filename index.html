<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhoodeva Developers</title>
  <meta name="description"
    content="Bhoodeva Developers - Custom Software and Web Solutions. Connect with us on social media.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #475569;
      --radius: 16px;
    }

    html,
    body {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(ellipse at top, #ffedd5 0%, #f8fafc 70%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    /* Neon orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatOrb1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.1);
      }
    }

    @keyframes floatOrb2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-40px, 30px) scale(1.05);
      }
    }

    body::before {
      width: 400px;
      height: 400px;
      background: rgba(251, 146, 60, 0.2);
      top: -100px;
      left: -100px;
      animation: floatOrb1 18s ease-in-out infinite;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: rgba(253, 186, 116, 0.2);
      bottom: -100px;
      right: -100px;
      animation: floatOrb2 22s ease-in-out infinite;
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(24px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      animation: cardPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Top gradient accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ea580c, #f97316, #16a34a);
    }

    /* --- LOGO --- */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    @keyframes floatLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .logo-box {
      width: 160px;
      height: 100px;
      background: #ffffff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(15, 23, 42, 0.04);
      animation: floatLogo 2.0s ease-in-out infinite;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* --- TITLE --- */
    .company-name {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ea580c 0%, #15803d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    .company-tagline {
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    /* --- DIVIDER --- */
    .divider {
      height: 2px;
      background: var(--border);
      margin-bottom: 1.5rem;
    }

    /* --- LINKS --- */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      background: rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(15, 23, 42, 0.06);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .link-btn:hover {
      background: rgba(15, 23, 42, 0.06);
      border-color: rgba(15, 23, 42, 0.12);
      transform: translateY(-2px);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    /* Left accent bar on hover */
    .link-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 3px 0 0 3px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }

    /* Sweep reflection sheen */
    .link-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%);
      transform: skewX(-25deg);
      transition: 2s ease;
      pointer-events: none;
      z-index: 1;
    }

    .link-btn:hover::after {
      left: 150%;
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .link-btn:hover::before {
      opacity: 1;
    }

    /* Brand accent colours */
    .btn-insta::before {
      background: linear-gradient(180deg, #db600e, #d24917, #dc2743, #cc2366, #bc1888);
    }

    .btn-fb::before {
      background: #1877f2;
    }

    .btn-x::before {
      background: #e7e7e7;
    }

    .btn-yt::before {
      background: #ff0000;
    }

    .btn-web::before {
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    }

    .btn-location::before {
      background: linear-gradient(135deg, #ef4444, #f43f5e);
    }

    .btn-project::before {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-wrap svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .icon-wrap svg.stroke {
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    .icon-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .icon-fb {
      background: #1877f2;
    }

    .icon-x {
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .icon-yt {
      background: #ff0000;
    }

    .icon-web {
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    }

    .icon-location {
      background: linear-gradient(135deg, #ef4444, #f43f5e);
    }

    .icon-project {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .link-label {
      flex: 1;
      font-weight: 600;
    }

    .arrow {
      color: rgba(0, 0, 0, 0.25);
      font-size: 1.5rem;
      transition: color 0.2s, transform 0.2s;
    }

    .link-btn:hover .arrow {
      color: rgba(15, 23, 42, 0.7);
      transform: translateX(3px);
    }

    /* Fade-in animation */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      animation: fadeUp 0.4s ease both;
    }

    .link-btn:nth-child(1) {
      animation: fadeUp 0.4s 0.1s ease both;
    }

    .link-btn:nth-child(2) {
      animation: fadeUp 0.4s 0.18s ease both;
    }

    .link-btn:nth-child(3) {
      animation: fadeUp 0.4s 0.26s ease both;
    }

    .link-btn:nth-child(4) {
      animation: fadeUp 0.4s 0.34s ease both;
    }

    .link-btn:nth-child(5) {
      animation: fadeUp 0.4s 0.42s ease both;
    }

    .link-btn:nth-child(6) {
      animation: fadeUp 0.4s 0.5s ease both;
    }

    .link-btn:nth-child(7) {
      animation: fadeUp 0.4s 0.58s ease both;
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: rgba(15, 23, 42, 0.4);
      text-align: center;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.25rem;
        border-radius: 22px;
      }

      .company-name {
        font-size: 1.4rem;
      }
    }

    @media (min-width: 768px) {
      .card {
        max-width: 600px;
        padding: 3rem 2.5rem;
      }

      .company-name {
        font-size: 1.85rem;
      }

      .logo-box {
        width: 180px;
        height: 110px;
      }
    }
  </style>
</head>
